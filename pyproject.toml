[project]
name = "osint-framework"
version = "0.1.0"
description = "An extensible OSINT framework for security researchers."
authors = [{ name = "Jules", email = "jules@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "colorama>=0.4.4",
    "pydantic>=1.9.0",
    "python-dotenv>=0.19.0",
    "rich>=11.0.0",
    "tenacity>=8.0.0",
    "validators>=0.18.2",
    "requests>=2.27.0",
    "requests-cache>=0.9.0",
    "dnspython>=2.2.0",
    "python-whois>=0.8.0",
    "ipwhois>=1.2.0",
    "scapy>=2.4.5",
    "beautifulsoup4>=4.10.0",
    "lxml>=4.8.0",
    "waybackpy>=3.0.7",
    "tldextract>=3.2.0",
    "shodan>=1.27.0",
    "exifread>=2.3.2",
    "python-magic>=0.4.24",
    "weasyprint>=54.0",
    "jinja2>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/user/osint-framework"
Repository = "https://github.com/user/osint-framework"

[project.scripts]
osint = "osint.app:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.7.0",
    "flake8>=5.0.4",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
